services:
  fuseki:
    image: stain/jena-fuseki:5.1.0
    user: "0:0"
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      JVM_ARGS: -Xmx2g
    ports:
      - "3030:3030"
    volumes:
      - fuseki_data:/fuseki/databases
      - ./docker/fuseki/config.ttl:/fuseki/configuration/config.ttl:ro
      - ./ontology:/data/ontology:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3030/$/ping >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ingestion-api:
    build:
      context: ./services/ingestion
    environment:
      FUSEKI_SPARQL_URL: http://fuseki:3030/ds/sparql
      FUSEKI_UPDATE_URL: http://fuseki:3030/ds/update
      FUSEKI_DATA_URL: http://fuseki:3030/ds/data
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8001:8001"
    depends_on:
      fuseki:
        condition: service_healthy

volumes:
  fuseki_data:
